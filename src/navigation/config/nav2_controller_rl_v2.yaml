controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0

    # Ackermann cannot turn in place -> keep yaw tolerance loose (no final spin-to-heading).
    # v2's model has no docking/final-approach logic of its own -- THIS checker is the only
    # thing that decides "goal reached" and stops the FollowPath loop. xy_goal_tolerance
    # (0.25) is intentionally tighter than the model's own waypoint capture radius (0.40) so
    # the run always ends via Nav2, never via the policy silently idling short of the goal.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15

    FollowPath:
      plugin: "rl_nav_cpp/RLControllerV2"
      model_path: "/home/ubuntu/ros2_ws/src/rl_nav_cpp/policy_reverse_15995.onnx"
      waypoint_spacing: 1.0        # m; unused while final_goal_only is true, kept for when it's off
      goal_change_thresh: 0.5      # m endpoint move that counts as a new goal (reset prev-action)
      # TESTING: feed only Nav2's final goal point (path endpoint), no intermediate carrot --
      # isolates the raw policy's own point-to-point navigation + lidar avoidance. Set false to
      # go back to waypoint-by-waypoint path following.
      final_goal_only: True
      # same yaw-180 lidar mount as v1 -- see rl_controller.cpp header for the tf2_echo confirmation
      lidar_angle_offset: 3.14159265
      lidar_ccw: True
      # DEPLOY SPEED: start LOW and ramp up during field testing. Model spec targets 1.0-1.2 m/s,
      # but navigation/config/nav2_params.yaml velocity_smoother max_velocity is currently capped
      # at 0.26 (raise it first) and collision_monitor stop/slowdown distances are tuned for the
      # slower v1 controller (stopping distance grows with v^2 -- retune before raising this much).
      v_cap: 0.25
      estop_distance: 0.30         # m; forward-corridor veto (0 disables) -- policy still steers,
                                   # this only clamps linear.x if it drives at a lidar-visible wall
      estop_half_width: 0.17       # m; corridor half-width (robot half-width 0.11 + margin)
      # rear ~54 deg arc is PHYSICALLY blind (robot structure blocks the lidar, confirmed by raw
      # serial probe). The model can't see back there no matter how well trained -- this is a
      # motion-based (odometry) veto, independent of lidar, for whenever it decides to reverse.
      reverse_stall_sec: 0.8       # s; commanding reverse w/ no real motion this long -> veto
      debug: True

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False
