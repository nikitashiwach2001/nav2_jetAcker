controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # FollowPathTEB is a FALLBACK controller, ported from v1: the shared BT
    # (navigate_to_pose_w_replanning_and_recovery_ackermann.xml) tries FollowPath (RL) a
    # couple times first; only if RL keeps failing (boxed in, oscillating) does it switch
    # controller_id to this one. The BT's fallback logic is generic (keys off the
    # "FollowPath"/"FollowPathTEB" controller_id strings, not the plugin implementation),
    # so registering both here is the only change needed -- no BT edits required.
    controller_plugins: ["FollowPath", "FollowPathTEB"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # radius stays BELOW the controller's reverse_dist (0.8) so a completed reverse
      # escape resets this timer instead of counting as "no progress" and aborting
      required_movement_radius: 0.25
      movement_time_allowance: 10.0

    # Ackermann cannot turn in place -> keep yaw tolerance loose (no final spin-to-heading)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.15

    FollowPath:
      plugin: "rl_nav_cpp/RLControllerV4"
      model_path: "/home/ubuntu/ros2_ws/src/rl_nav_cpp/policies/policy_v4_model6998.onnx"
      goal_change_thresh: 0.5      # m endpoint move that resets the GRU (new goal vs replan)
      # was hardcoded to 2.0 m; UNVERIFIED against this model's actual training spec (we
      # only confirmed the ONNX graph's math, not the semantic scale of its inputs). Tune
      # live to test: ros2 param set /controller_server FollowPath.carrot_lookahead_dist 0.7
      carrot_lookahead_dist: 1.0
      # same yaw-180 lidar mount as v1/v2 -- see rl_controller.cpp header for the tf2_echo confirmation
      lidar_angle_offset: 3.14159265
      lidar_ccw: True
      # DEPLOY SPEED: spec target is a fixed 0.60 m/s, "no governor". Untested on real
      # hardware with this model -- start LOW and ramp up during field testing. Also note
      # navigation/config/nav2_params.yaml velocity_smoother max_velocity is currently
      # capped at 0.26 regardless of this param (raise it there once ready for full speed).
      speed_scale: 0.25
      # if robot steers WRONG way on a straight path, flip to -1.0 (live, no rebuild):
      #   ros2 param set /controller_server FollowPath.steer_sign -1.0
      steer_sign: 1.0
      estop_distance: 0.30         # m; blocker in the driving corridor closer than this -> stop (0 disables)
      estop_release: 0.40          # m; hysteresis: resume only after the corridor clears past this
      estop_half_width: 0.17       # m; corridor half-width (robot half-width 0.11 + margin)
      reverse_clear: 0.55          # m; reverse until the corridor ahead is clear past this...
      reverse_dist: 0.80           # m; ...capped at this distance
      reverse_rear_stop: 0.22      # m; rear bumper is ~0.16 m behind the lidar
      estop_fail_sec: 1.5          # s; stuck this long -> built-in reverse recovery
      # this model, like v1, was NOT trained to reverse -- all reverse motion here is the
      # same hardcoded steered-reverse recovery v1 uses (rl_controller.cpp), unchanged.
      # EMA on final steering command (weight on PREVIOUS command); kills ~3.6 Hz weave
      # jitter, passes real (<1 Hz) turns. 0.8 = smoother/more lag, 0.6 = more responsive.
      steer_ema_alpha: 0.7
      debug: True

    # Fallback controller (see comment above controller_plugins), ported unchanged from
    # v1's FollowPathTEB block (same as config/nav2_controller_teb.yaml's standalone setup,
    # just registered under a second controller_id here). Runs at the shared
    # controller_frequency (30 Hz, set for RL above) rather than TEB's own usual 10 Hz --
    # acceptable since this is a last-resort fallback, not the tuned primary path.
    FollowPathTEB:
      plugin: teb_local_planner::TebLocalPlannerROS

      teb_autosize: 1.0
      dt_ref: 0.6
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: 0.3
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 5
      publish_feedback: False

      # Robot
      max_vel_x: 0.4
      max_vel_theta: 2.0
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      min_turning_radius: 0.7
      wheelbase: 0.213
      footprint_model:
        type: "circular"
        radius: 0.05

      # GoalTolerance
      free_goal_vel: False

      # Obstacles
      min_obstacle_dist: 0.25
      inflation_dist: 0.0
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15

      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True

      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      costmap_converter_spin_thread: True
      costmap_converter_rate: 10

      # Optimization
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 0.5
      weight_max_vel_theta: 0.5
      weight_acc_lim_x: 0.5
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 50.0
      weight_adapt_factor: 2.0

      # Homotopy Class Planner
      enable_homotopy_class_planning: True
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False
