local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real JetAcker outline (base_footprint at rear axle: 0.296 m body + front wheels,
      # ~0.2 m wide). Also feeds local_costmap/published_footprint, which the collision
      # monitor's "approach" polygon uses for velocity-aware stopping.
      footprint: "[[0.30, 0.13], [0.30, -0.13], [-0.18, -0.13], [-0.18, 0.13]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # reverted 2026-07-30: 0.45/3.5 caused hesitant/roundabout paths in congested
        # areas -- real collision safety comes from footprint (hard boundary, below) and
        # the RL controller's own lidar-based estop/corridor checks (unaffected by this
        # value either way), so a wider inflation was pure cost-preference overhead with
        # no safety benefit in tight spaces. Narrowed further (0.35->0.25) same reasoning.
        cost_scaling_factor: 5.0
        inflation_radius: 0.25
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # Real robot outline so global plans keep feasible clearance instead of hugging
      # walls a 0.05 m "dot" could pass but the 0.2 m-wide car cannot (dead-end trap).
      footprint: "[[0.30, 0.13], [0.30, -0.13], [-0.18, -0.13], [-0.18, 0.13]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-09: widened again (0.25 -> 0.35) with a much gentler decay (5.5 -> 3.0),
        # to stop the global plan hugging obstacles. This is the GLOBAL costmap only -- the
        # local one stays at 0.25/5.0 deliberately. When both were widened on 2026-07-30 the
        # result was hesitant, roundabout behaviour in tight spots; only the global one
        # shapes where the path is drawn, so the local costmap does not need to change.
        #
        # Beyond inflation_radius the cost is exactly zero, so the planner has no reason at
        # all to keep further away than this number -- 0.25 was the actual cap on how much
        # clearance the plan could ever prefer. cost_scaling_factor is the decay rate: at 5.5
        # the cost had already collapsed by ~0.2 m, so even inside the radius there was
        # barely any gradient pushing the path outward. 3.0 keeps a real gradient across the
        # whole 0.35 m.
        #
        # Measured from map_01: median clearance in drivable space is only 0.25 m and the
        # most open point in the entire map is 1.25 m. So a uniform 0.30 m of clearance is
        # not physically available everywhere -- this is a PREFERENCE, not a guarantee.
        # Inflation never blocks anything (only the footprint does), so narrow-but-passable
        # gaps stay usable; they just cost more, and the planner takes an open route instead
        # when one exists.
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False 

map_server:
  ros__parameters:
    use_sim_time: False
    #topic_name: map
    #frame_id: map
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# Hybrid-A* instead of NavFn: NavFn plans in (x,y) only and ignores heading, so its paths
# leave the robot's position in directions an Ackermann can only reach by spinning in place.
# Hybrid-A* plans in (x,y,theta) with car-like primitives and a minimum turning radius --
# every path starts from the FRONT of the robot along its current heading and is drivable.
# DUBIN (forward-only) matches the RL policy; escapes in reverse stay the controller's job.
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0   # Hybrid-A* is heavier than NavFn; BT replans at 1 Hz anyway
    use_sim_time: False
    planner_plugins: ["GridBased", "Escape"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # raised 0.5 -> 1.0 (2026-07-28): if the goal itself is boxed in, plan to the closest
      # reachable pose within 1 m instead of failing -- "get as near as possible, never abort"
      tolerance: 1.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"     # forward-only, bounded curvature. REEDS_SHEPP (which
                                           # allows reverse segments) was tried but only helps a
                                           # reverse-capable controller (v2); v1's model was never
                                           # trained to reverse, so it just curved forward anyway
                                           # toward waypoints meant to be backed into -- worse
                                           # than a clean forward-only path. Revert if v1 is active.
      minimum_turning_radius: 0.35         # m; physical min is wheelbase/tan(0.6) ~= 0.31
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      # 2.0 -> 3.5 (2026-08-09): how heavily the Hybrid-A* search weighs costmap cost against
      # path length. Widening the global inflation above only creates the gradient; this is
      # what makes the planner actually pay to stay off it, instead of taking the short line
      # past an obstacle because the detour costs more than the proximity. Too high and it
      # starts preferring silly detours -- back off toward 2.5 if that shows up.
      cost_penalty: 3.5
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

    # ESCAPE planner (added 2026-07-28). SmacPlannerHybrid does an SE2 footprint collision
    # check on the START pose and refuses outright -- "Starting point in lethal space! Cannot
    # create feasible plan" -- whenever the robot's pose overlaps lethal cells (touching a
    # wall, or mis-localized into one). Recorded 2026-07-28 19:42: once that happened EVERY
    # subsequent goal failed to plan, including brand new ones, and clearing the costmaps
    # could not help because the cells came from the STATIC MAP. Navigation was dead until
    # relaunch. NavFn clears the robot's own cell before planning, so it still produces a path
    # out of that state. The BT tries GridBased first and only falls back to this one, so
    # normal driving still gets Ackermann-feasible Hybrid-A* paths; this one just gets the
    # robot un-wedged, after which the next 1 Hz replan returns to GridBased.
    Escape:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 1.0   # shorter horizon: BackUp backstop vetoes less when near walls
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 2026-08-18: raised with throttle_scale 0.35 -> 0.70. This MUST stay >= throttle_scale:
    # the smoother clips linear.x but passes angular.z through (scale_velocities: False), so
    # any clipping inflates the executed curvature.
    # OLD: max_velocity: [0.36, 0.0, 1.0]
    max_velocity: [0.75, 0.0, 1.0]
    min_velocity: [-0.36, 0.0, -1.0]
    # angular accel tightened 3.2 -> 1.8 rad/s^2 (2026-07-28): second-stage smoothing for
    # left-right weave during normal RL-driven navigation, complementing each RL
    # controller's own steer_ema_alpha filter (this acts on angular.z downstream, after
    # the controller, at the shared velocity_smoother -- affects all of v1-v5 and TEB/DWB).
    max_accel: [2.5, 0.0, 1.8]
    max_decel: [-2.5, 0.0, -1.8]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Safety layer between the velocity smoother and the motors, so the robot stops BEFORE
# touching a wall and the progress checker then triggers behavior-server recoveries.
# "approach" projects the footprint along the commanded velocity and only limits motion
# TOWARD an obstacle. A static "stop" polygon here would also zero the reverse commands
# of the BackUp recovery while wall points sit inside the front box, trapping the robot
# in dead-ends. Footprint coordinates are in base_footprint frame, x forward, y left (m).
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0      # lidar silent for 1s -> treat as unsafe and stop
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      # approach polygons take their shape from footprint_topic (points would be ignored);
      # the local costmap publishes the real JetAcker footprint configured there
      footprint_topic: "local_costmap/published_footprint"
      # 2026-08-18: 1.2 -> 0.8, with throttle_scale 0.35 -> 0.70.
      # This is a BRAKING horizon only -- collision_monitor never steers, so obstacle DODGING
      # is unaffected (that is the controller's blend_clear_dist: 2.5 handover to the policy).
      # Effect: allowed speed is v_out = d_free / this, so 1.2 -> 0.8 is a flat 1.5x wherever
      # the monitor is active (turns, head-on approaches, paths not aligned with the corridor).
      # It does NOT change speed in open corridors -- forward clearance there is ~4 m and the
      # monitor never engages.
      # Safety at 0.70 m/s: full speed is now held until the gap is 0.86 m (was 1.14 m), which
      # leaves 0.56 m of free space; worst-case stop needs 0.245 m (0.210 s reaction across
      # lidar 7.9 Hz + controller 30 Hz + smoother 20 Hz, then 0.098 m of decel at 2.5 m/s^2)
      # -> 0.315 m margin. Do not go below 0.8; at 0.6 the margin nearly vanishes.
      # estop_distance (0.30 m, in nav2_controller_rl_v5.yaml) is a separate hard layer and
      # still applies unchanged.
      # OLD: time_before_collision: 1.2
      time_before_collision: 0.8
      # 2026-08-18: 0.1 -> 0.05. collision_monitor quantizes predicted collision time to this
      # step, so the scaled output velocity moves in jumps (0.088 m/s at 0.1 s / 0.70 m/s;
      # 0.044 m/s at 0.05 s). It sits AFTER velocity_smoother in the chain
      # (cmd_vel_smoothed -> collision_monitor -> cmd_vel), so nothing smooths those jumps --
      # they go straight to the motors, and they doubled when throttle went 0.35 -> 0.70.
      # Costs 2x collision checks/cycle; revert this FIRST if nav2_container gets unstable.
      # OLD: simulation_time_step: 0.1
      simulation_time_step: 0.05
      # tolerate a few boundary points already grazing the footprint (robot touching a wall)
      # so the RL controller's reverse escape is not zeroed while in contact
      max_points: 8
      visualize: True
      polygon_pub_topic: "polygon_approach"
      # v1 safety net, re-enabled: with the controller's e-stop now correctly oriented
      # (lidar_angle_offset fix) the robot stops 0.30 m short, so the freeze-on-contact
      # trap (points inside footprint -> all cmd_vel zeroed) should no longer be reachable.
      # (2026-08-03: briefly disabled to test whether this polygon caused the
      # nav2_container segfault -- it did NOT, the crash persisted with it off, so it's
      # restored here.)
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_raw"
      enabled: True
